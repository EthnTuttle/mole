[package]
name = "mole"
version = "0.1.0"
edition = "2021"
description = "Secure TCP tunneling over Iroh - access your machine from anywhere"
license = "MIT"
repository = "https://github.com/EthnTuttle/mole"

[features]
default = ["gui"]
gui = ["eframe", "egui", "arboard"]

[lib]
name = "mole"
path = "src/lib.rs"

[[bin]]
name = "mole"
path = "src/main.rs"

[dependencies]
# Iroh networking
iroh = "0.95"
n0-future = "0.3"
n0-error = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security
data-encoding = "2"
rand = "0.8"

# File system
dirs = "6"

# GUI (optional)
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.31", optional = true }
arboard = { version = "3", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
